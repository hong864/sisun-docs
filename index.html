<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시선닷컴 기획 문서 허브</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e6e8eb; --ink:#1c1e21; --sub:#6b7280;
    --gray:#e5e7eb; --gray-t:#374151;
    --blue:#dbeafe; --blue-t:#1d4ed8;
    --green:#dcfce7; --green-t:#15803d;
    --yellow:#fef9c3; --yellow-t:#a16207;
    --accent:#4f46e5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;padding:32px 20px 64px}
  .wrap{max-width:960px;margin:0 auto}
  header h1{margin:0 0 4px;font-size:26px;letter-spacing:-.3px}
  header .sub{color:var(--sub);font-size:13px;margin-bottom:20px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
  .tabs{display:inline-flex;background:#eef0f3;border-radius:10px;padding:3px;gap:2px}
  .tab{border:none;background:transparent;padding:7px 14px;border-radius:8px;font-size:13px;
    font-weight:600;color:var(--sub);cursor:pointer;transition:.15s}
  .tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .search{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);
    border-radius:10px;font-size:14px;background:#fff}
  .search:focus{outline:none;border-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 22px}
  .chip{padding:6px 13px;border:1px solid var(--line);background:#fff;border-radius:999px;
    font-size:13px;cursor:pointer;color:var(--gray-t);transition:.15s}
  .chip:hover{border-color:var(--accent)}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .n{opacity:.65;margin-left:5px;font-size:12px}
  section{margin-bottom:26px}
  section h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  section h2 .cnt{font-size:12px;color:var(--sub);font-weight:500}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);
    text-decoration:none;color:inherit;transition:background .12s}
  .row:last-child{border-bottom:none}
  .row:hover{background:#fafbfc}
  .id{flex:none;min-width:38px;text-align:center;font-size:12px;font-weight:700;color:var(--sub);
    background:#f1f3f5;border-radius:7px;padding:4px 7px;font-variant-numeric:tabular-nums}
  .sno{flex:none;min-width:46px;text-align:center;font-size:12px;font-weight:700;
    color:#9aa1ab;background:#fff;border:1px dashed #cbd2da;border-radius:7px;padding:4px 7px;
    font-variant-numeric:tabular-nums;cursor:text;outline:none}
  .sno:empty::before{content:"+No";color:#c2c8d0;font-weight:600}
  .sno:focus{border-style:solid;border-color:var(--accent);color:var(--ink)}
  .sno.has{color:#7c3aed;background:#f3effe;border:1px solid #ddd0fb}
  .title{flex:1;font-size:14px;font-weight:500;line-height:1.35}
  .meta{flex:none;display:flex;align-items:center;gap:10px}
  .badge{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .b-gray{background:var(--gray);color:var(--gray-t)}
  .b-blue{background:var(--blue);color:var(--blue-t)}
  .b-green{background:var(--green);color:var(--green-t)}
  .b-yellow{background:var(--yellow);color:var(--yellow-t)}
  .date{font-size:12px;color:var(--sub);min-width:78px;text-align:right;font-variant-numeric:tabular-nums}
  .urg{font-size:10.5px;font-weight:700;color:#b91c1c;background:#fee2e2;padding:2px 6px;border-radius:5px}
  .empty{display:none;text-align:center;color:var(--sub);font-size:13px;padding:40px}
  footer{margin-top:30px;color:var(--sub);font-size:12px;text-align:center}
  @media(max-width:560px){
    .row{flex-wrap:wrap}
    .date{min-width:auto;text-align:left}
    .title{flex-basis:100%;order:2}
    .meta{order:3}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>시선닷컴 기획 문서 허브</h1>
    <div class="sub">Homi_개인일감 DB · 생성일 2026-06-10 · 총 <span id="total">0</span>건 · <b>#ID</b>=Homi DB · <b>Sisun No</b>=Sisun-Tasks(클릭해 입력)</div>
  </header>

  <div class="controls">
    <div class="tabs" id="tabs">
      <button class="tab active" data-mode="cat">구분별</button>
      <button class="tab" data-mode="pri">우선순위별</button>
    </div>
    <input class="search" id="q" type="text" placeholder="제목 · ID · Sisun No 검색…">
  </div>
  <div class="chips" id="chips"></div>

  <div id="list"></div>
  <div class="empty" id="empty">검색 결과가 없습니다.</div>

  <footer>상태 배지 — 회색: 예정·시작전 / 노랑: 일감접수 / 파랑: 진행중 / 초록: 완료</footer>
</div>

<script>
// sisunNo: Sisun-Tasks DB의 No(ID). 제목 일치로 확정된 건은 미리 채움, 나머지는 화면에서 직접 입력(브라우저 저장).
const DATA = [
  {id:13, title:"로그아웃 상태에서 장바구니 담기 이슈 개선", cat:"기획서/PRD", status:"기획 진행중", date:"", urgent:false, sisunNo:"1759", url:"https://app.notion.com/p/379f6986169c8027915bcddbdb0df853"},
  {id:15, title:"해외배송 중복피킹", cat:"기획서/PRD", status:"일감접수", date:"", urgent:true, sisunNo:"1779", url:"https://app.notion.com/p/37af6986169c80d3a05bce90047bf068"},
  {id:2,  title:"[상품]모듈 개선", cat:"기획서/PRD", status:"시작전", date:"", urgent:false, sisunNo:"", url:"https://app.notion.com/p/374f6986169c80759af2ec43a656b583"},
  {id:17, title:"품번변경 리오더 이슈 업데이트 - 온라인 협의체 내용 일부", cat:"요구사항 정의서", status:"기획 진행중", date:"", urgent:false, sisunNo:"", url:"https://app.notion.com/p/37af6986169c80cb9a7ad7aef1403df2"},
  {id:8,  title:"[전시]모듈 개선", cat:"요구사항 정의서", status:"시작전", date:"", urgent:false, sisunNo:"", url:"https://app.notion.com/p/374f6986169c8016b95affb1c5a9be94"},
  {id:14, title:"상품상세(PDP) 기존 vs 변경 요약장표 및 변경항목(테스트 및 보고 리뷰 용)", cat:"개발 리뷰", status:"일감접수", date:"2026-06-09", urgent:true, sisunNo:"", url:"https://app.notion.com/p/37af6986169c805c8677d248fc03857d"},
  {id:4,  title:"[주문]모듈 개선", cat:"구분 없음", status:"시작전", date:"", urgent:false, sisunNo:"", url:"https://app.notion.com/p/374f6986169c80abaab5c2f770474620"},
  {id:9,  title:"[검색]모듈 개선", cat:"구분 없음", status:"시작전", date:"", urgent:false, sisunNo:"", url:"https://app.notion.com/p/374f6986169c80878eddd748829683bb"},
  {id:3,  title:"[회원]모듈 개선", cat:"구분 없음", status:"시작전", date:"", urgent:false, sisunNo:"", url:"https://app.notion.com/p/374f6986169c808bb089e0adb746467f"},
  {id:5,  title:"[배송]모듈 개선", cat:"구분 없음", status:"시작전", date:"", urgent:false, sisunNo:"", url:"https://app.notion.com/p/374f6986169c80579991cf09c50f4d1e"},
  {id:7,  title:"[프로모션]모듈 개선", cat:"구분 없음", status:"시작전", date:"", urgent:false, sisunNo:"", url:"https://app.notion.com/p/374f6986169c801b9d67d4f63da36a9c"},
  {id:6,  title:"[클레임]모듈 개선", cat:"구분 없음", status:"시작전", date:"", urgent:false, sisunNo:"", url:"https://app.notion.com/p/374f6986169c80fc8b07fa1a038f4a52"},
  {id:12, title:"PDP 개선, 테스트 케이스", cat:"구분 없음", status:"일감접수", date:"", urgent:false, sisunNo:"", url:"https://app.notion.com/p/379f6986169c807ab552d76d5eba0687"},
];

// 화면에서 입력한 Sisun No 저장/복원 (로컬 파일 기준)
const SKEY = "sisunNoMap";
let sisunMap = {};
try { sisunMap = JSON.parse(localStorage.getItem(SKEY) || "{}"); } catch(e){ sisunMap = {}; }
DATA.forEach(d=>{ if(sisunMap[d.id]!==undefined) d.sisunNo = sisunMap[d.id]; });
function saveSisun(id, val){
  sisunMap[id] = val;
  try { localStorage.setItem(SKEY, JSON.stringify(sisunMap)); } catch(e){}
  const d = DATA.find(x=>x.id===id); if(d) d.sisunNo = val;
}

// 우선순위 값 부여 (긴급 옵션 외에는 일반)
DATA.forEach(d=>{ d.priority = d.urgent ? "긴급" : "일반"; });

const GROUPS = {
  cat:    { key:"cat",      order:["기획서/PRD","요구사항 정의서","정책서","개발 리뷰","벤치마킹","구분 없음"] },
  pri:    { key:"priority", order:["긴급","일반"] },
  status: { key:"status",   order:["일감접수","기획 진행중","디자인 진행중","퍼블리싱 진행중","개발 진행중","기획 완료","개발 완료","완료","예정","시작전"] },
};

function badgeClass(s){
  if(/완료/.test(s)) return "b-green";
  if(/진행중/.test(s)) return "b-blue";
  if(s==="일감접수") return "b-yellow";
  return "b-gray"; // 예정/시작전
}

let mode = "cat";
let activeCat = "전체";
let query = "";

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";
  let shown = 0;
  const g = GROUPS[mode];
  // 데이터에 존재하는 그룹값을 정의된 순서대로, 그 외 값은 뒤에 붙임
  const present = [...new Set(DATA.map(d=>d[g.key]||"구분 없음"))];
  const order = [...g.order.filter(v=>present.includes(v)), ...present.filter(v=>!g.order.includes(v))];
  order.forEach(cat=>{
    if(activeCat!=="전체" && activeCat!==cat) return;
    const items = DATA.filter(d=>(d[g.key]||"구분 없음")===cat).filter(d=>{
      const q = query.trim().toLowerCase();
      if(!q) return true;
      return d.title.toLowerCase().includes(q) || String(d.id).includes(q) || String(d.sisunNo||"").includes(q);
    }).sort((a,b)=>a.id-b.id);
    if(!items.length) return;
    shown += items.length;
    const sec = document.createElement("section");
    const hot = (mode==="pri" && cat==="긴급") ? ' style="color:#b91c1c"' : '';
    sec.innerHTML = `<h2${hot}>${cat} <span class="cnt">${items.length}건</span></h2>`;
    const card = document.createElement("div");
    card.className = "card";
    items.forEach(d=>{
      const a = document.createElement("a");
      a.className = "row"; a.href = d.url; a.target = "_blank"; a.rel="noopener";
      a.innerHTML = `
        <span class="id" title="Homi 개인일감 DB ID">#${d.id}</span>
        <span class="sno ${d.sisunNo?'has':''}" data-id="${d.id}" contenteditable="true" spellcheck="false"
              title="Sisun-Tasks No (클릭해 입력·자동 저장)">${d.sisunNo||''}</span>
        <span class="title">${d.title}${d.urgent?' <span class="urg">긴급</span>':''}</span>
        <span class="meta">
          <span class="badge ${badgeClass(d.status)}">${d.status}</span>
          <span class="date">${d.date||'—'}</span>
        </span>`;
      // Sisun No 인라인 편집
      const sno = a.querySelector(".sno");
      sno.addEventListener("click", e=>{ e.preventDefault(); e.stopPropagation(); });
      sno.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); sno.blur(); } });
      sno.addEventListener("blur", ()=>{
        const v = sno.textContent.replace(/[^0-9]/g,"").trim();
        sno.textContent = v;
        sno.classList.toggle("has", !!v);
        saveSisun(d.id, v);
      });
      card.appendChild(a);
    });
    sec.appendChild(card);
    list.appendChild(sec);
  });
  document.getElementById("empty").style.display = shown? "none":"block";
}

function buildChips(){
  const chips = document.getElementById("chips");
  const g = GROUPS[mode];
  const counts = {};
  DATA.forEach(d=>{ const v = d[g.key]||"구분 없음"; counts[v]=(counts[v]||0)+1; });
  const present = Object.keys(counts);
  const ordered = [...g.order.filter(v=>counts[v]), ...present.filter(v=>!g.order.includes(v))];
  const cats = ["전체",...ordered];
  chips.innerHTML = cats.map(c=>{
    const n = c==="전체"?DATA.length:counts[c];
    const active = c===activeCat ? " active":"";
    return `<button class="chip${active}" data-cat="${c}">${c}<span class="n">${n}</span></button>`;
  }).join("");
  chips.querySelectorAll(".chip").forEach(ch=>{
    ch.onclick=()=>{
      activeCat = ch.dataset.cat;
      chips.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
      ch.classList.add("active");
      render();
    };
  });
}

function buildTabs(){
  document.querySelectorAll("#tabs .tab").forEach(t=>{
    t.onclick=()=>{
      mode = t.dataset.mode;
      activeCat = "전체";
      document.querySelectorAll("#tabs .tab").forEach(x=>x.classList.remove("active"));
      t.classList.add("active");
      buildChips();
      render();
    };
  });
}

document.getElementById("total").textContent = DATA.length;
document.getElementById("q").addEventListener("input", e=>{query=e.target.value;render();});
buildTabs();
buildChips();
render();
</script>
</body>
</html>
